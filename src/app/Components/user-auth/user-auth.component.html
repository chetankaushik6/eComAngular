<div class="user-auth">
    
    <form #userSignup="ngForm" (ngSubmit)="onSignup(userSignup.value)">
        <h1>User Signup</h1>
        <div>
            <label for="username">Username</label>
            <input type="text" id="username" name="username" ngModel required>
        </div>
        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" ngModel required>
        </div>
        <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" ngModel required>
        </div>
        <button type="submit" [disabled]="userSignup.invalid">Sign Up</button>
    </form>
</div>
