<div class="user-auth">
     <div class="user-signup" *ngIf="!showLogin">
          <form #userSignup="ngForm" (ngSubmit)="onSignup(userSignup.value)">
        <h1>User Signup</h1>
        <div>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" ngModel required>
        </div>
        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" ngModel required>
        </div>
        <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" ngModel required>
        </div>
        <button type="submit" [disabled]="userSignup.invalid">Sign Up</button>
        <p class="linkform">Already have an account? <a (click)="openLogin()">Login here</a></p>
    </form>
     </div>
  
     <div class="user-login" *ngIf="showLogin">
        <p class="error-p">{{authError}}</p>
    
          <form #userLogin="ngForm" (ngSubmit)="onLogin(userLogin.value)">
        <h1>User Login</h1>
        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email"
            #email="ngModel" ngModel required>
            <p *ngIf="email.invalid && email.touched"><span>Email is required</span></p>
            <!-- <p><span>{{email.errors?.['required'] ? 'Email is required' : ''}}</span></p> -->
        </div>
        <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" [minlength]="2" [maxlength]="10" ngModel required>
        </div>
        <button type="submit" [disabled]="userLogin.invalid">Login</button>
        <p class="linkform">create an account? <a (click)="openSignup()">Sign up here</a></p>
    </form>
     </div>
</div>
