<div class="checkout">
    <h1>Checkout</h1>
    <div class="row">
        <div class="col-md-7 shipping-form">
            <h2>Add Shipping Address</h2>
            <form #checkoutForm="ngForm" (ngSubmit)="onSubmit(checkoutForm.value)">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" class="form-control" id="email" name="email" ngModel required>
                </div>
                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" class="form-control" id="address" name="address" ngModel required>
                </div>
                <div class="form-group">
                    <label for="contact">Contact Number</label>
                    <input type="text" class="form-control" id="contact" name="contact" ngModel required>
                </div>
                <!-- <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" class="form-control" id="city" name="city" ngModel required>
                </div>
                <div class="form-group">
                    <label for="zip">ZIP Code</label>
                    <input type="text" class="form-control" id="zip" name="zip" ngModel required>
                </div> -->
                <button type="submit" class="btn btn-primary">Order Now</button>
            </form>
        </div>
        <div class="col-md-5 billing-info">
            <h2>Billing Information</h2>
            <p>Please review your order details before placing the order.</p>

            <div class="billing-summary">
                <div class="summary-row">
                    <span>Items</span>
                    <span>{{ cartItemCount }}</span>
                </div>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span>₹{{ subtotal }}</span>
                </div>
                <div class="summary-row">
                    <span>Shipping</span>
                    <span>₹{{ shipping }}</span>
                </div>
                <div class="summary-row total">
                    <span>Total Amount</span>
                    <span>₹{{ totalAmount }}</span>
                </div>
            </div>

            <div class="payment-method">
                <h3>Payment Method</h3>
                <div *ngFor="let option of paymentMethods" class="form-check">
                    <input
                        class="form-check-input"
                        type="radio"
                        id="payment-{{ option.value }}"
                        name="paymentMethod"
                        [value]="option.value"
                        [(ngModel)]="paymentMethod"
                    />
                    <label class="form-check-label" for="payment-{{ option.value }}">
                        {{ option.label }}
                    </label>
                </div>
            </div>

            <div class="selected-payment">
                <strong>Selected payment:</strong> {{ paymentMethod | titlecase }}
            </div>
        </div>
    </div>
</div>
