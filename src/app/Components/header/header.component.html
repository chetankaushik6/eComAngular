<nav class="nav">
  <h1 class="logo"><a routerLink="/">E-comm</a></h1>

  <div class="search-container" *ngIf="menuType==='default'">
    <input type="text" placeholder="Search for products" #searchBox
(keyup)="searchProduct(searchBox.value)" />
    <button>🔍</button>
  </div>

  <div class="myMenus" [ngSwitch]="menuType">
    <ul *ngSwitchCase="'default'">
      <li><a routerLink="/">Home</a></li>
      <li><a routerLink="/seller">Seller</a></li>
      <li><a routerLink="/login">Login</a></li>
      <li><a routerLink="/cart">Cart(0)</a></li>
    </ul>

    <ul *ngSwitchCase="'seller'">
          <li><a routerLink="/seller-add-product">Add Product</a></li>
      <li><a routerLink="/sellerHome">Product List</a></li>
      <li><a class="mnu" (click)="logout()">Logout</a></li>
      <li><a routerLink="#">{{sellerName | titlecase}}</a></li>
    </ul>
  </div>
</nav>
