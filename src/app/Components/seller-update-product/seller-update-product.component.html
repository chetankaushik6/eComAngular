<div class="update-product">
    <h1>update Product</h1>

    <form #addProduct="ngForm" (ngSubmit)="submit(addProduct.value)">

         <p class="success-p">{{productMsg}}</p>
        <div class="form-group">
            <label>Product Name</label>
            <input type="text" name="name" ngModel="{{productData?.name}}" required>
        </div>

        <div class="form-group">
            <label>Product Price</label>
            <input type="number" name="price" ngModel="{{productData?.price}}" required>
        </div>

        <div class="form-group">
            <label>Color</label>
            <input type="text" name="color" ngModel="{{productData?.color}}" required>
        </div>

        <div class="form-group">
            <label>Category</label>
            <input type="text" name="category" ngModel="{{productData?.category}}" required>
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="4" ngModel="{{productData?.description}}" required></textarea>
        </div>

        <div class="form-group">
            <label>Product Image URL</label>
            <input type="text" name="image" ngModel="{{productData?.image}}" required>
        </div>

        <!-- <button type="submit" class="btn">Add Product</button> -->
        <button type="submit" [disabled]="addProduct.invalid" class="btn">
            Update Product
        </button>
    </form>
</div>
